<text text-anchor="middle" x="330" y="-502.8" font-family="Helvetica,sans-Serif" font-size="14.00" fill="#fff0f0">(docker_run_as_host_user: true)</text>
<text text-anchor="middle" x="330" y="-487.8" font-family="Helvetica,sans-Serif" font-size="14.00" fill="#fff0f0">CapEff = 0000000000000000</text>
<text text-anchor="middle" x="330" y="-456.8" font-family="Helvetica,sans-Serif" font-size="14.00" fill="#fff0f0">CHOWN/DAC_OVERRIDE/FOWNER only sit in</text>
<text text-anchor="middle" x="330" y="-441.8" font-family="Helvetica,sans-Serif" font-size="14.00" fill="#fff0f0">the BOUNDING set — inert for non&#45;root.</text>
<text text-anchor="middle" x="330" y="-426.8" font-family="Helvetica,sans-Serif" font-size="14.00" fill="#fff0f0">apt&#45;get update fails immediately:</text>
<text text-anchor="middle" x="330" y="-411.8" font-family="Helvetica,sans-Serif" font-size="14.00" fill="#fff0f0">&quot;Permission denied&quot; on /var/lib/apt/lists</text>
