<text text-anchor="middle" x="242" y="-600.8" font-family="Helvetica,sans-Serif" font-size="14.00" fill="#dfe6ee">1. Back up ~/.hermes/config.yaml</text>
<text text-anchor="middle" x="242" y="-585.8" font-family="Helvetica,sans-Serif" font-size="14.00" fill="#dfe6ee">cp config.yaml config.yaml.bak&#45;$(date +%s)</text>
